- alias: Arlo low battery notification
  mode: queued
  triggers:
    - trigger: numeric_state
      entity_id:
        - sensor.arlo_gate_battery
        - sensor.arlo_garage_battery
        - sensor.arlo_porch_battery
      below: 25
  actions:
    - action: notify.mobile_app_your_phone
      data:
        title: Arlo battery low
        message: "{{ state_attr(trigger.entity_id, 'friendly_name') }} is {{ states(trigger.entity_id) }}%."

- alias: Arlo camera API unavailable
  triggers:
    - trigger: state
      entity_id: sensor.arlo_cam_api_webhook_paths
      to: unavailable
      for: "00:05:00"
  actions:
    - action: notify.mobile_app_your_phone
      data:
        title: Arlo integration unavailable
        message: Home Assistant cannot reach arlo-cam-api.
