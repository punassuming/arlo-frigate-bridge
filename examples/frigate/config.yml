mqtt:
  host: 192.168.50.172
  user: frigate
  password: CHANGE_ME
  topic_prefix: frigate

# MediaMTX is the only process that connects directly to each battery camera.
go2rtc:
  streams:
    arlo_gate:
      - rtsp://192.168.50.REPLACE:8554/arlo_gate
      - ffmpeg:arlo_gate#audio=opus
    arlo_garage:
      - rtsp://192.168.50.REPLACE:8554/arlo_garage
      - ffmpeg:arlo_garage#audio=opus
    arlo_porch:
      - rtsp://192.168.50.REPLACE:8554/arlo_porch
      - ffmpeg:arlo_porch#audio=opus

record:
  enabled: true
  retain:
    days: 7
    mode: motion

detect:
  enabled: true

# Audio analysis is active only while a PIR event has already woken the camera.
audio:
  enabled: true
  min_volume: 500
  listen:
    - bark
    - fire_alarm
    - scream
    - speech
    - yell

cameras:
  arlo_gate:
    enabled: false
    ffmpeg:
      output_args:
        record: preset-record-generic-audio-aac
      inputs:
        - path: rtsp://127.0.0.1:8554/arlo_gate
          input_args: preset-rtsp-restream
          roles: [detect, record, audio]
    live:
      streams:
        Main: arlo_gate

  arlo_garage:
    enabled: false
    ffmpeg:
      output_args:
        record: preset-record-generic-audio-aac
      inputs:
        - path: rtsp://127.0.0.1:8554/arlo_garage
          input_args: preset-rtsp-restream
          roles: [detect, record, audio]
    live:
      streams:
        Main: arlo_garage

  arlo_porch:
    enabled: false
    ffmpeg:
      output_args:
        record: preset-record-generic-audio-aac
      inputs:
        - path: rtsp://127.0.0.1:8554/arlo_porch
          input_args: preset-rtsp-restream
          roles: [detect, record, audio]
    live:
      streams:
        Main: arlo_porch
