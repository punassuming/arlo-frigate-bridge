WifiCountryCode: "US"
VideoAntiFlickerRate: 60
VideoQualityDefault: "default"
NotifyRegisteredAndStatusUpdate: true
NotifyOnMotionAlert: true
NotifyOnMotionTimeoutAlert: false
NotifyOnAudioAlert: false
NotifyOnButtonPressAlert: false

# Replace the two webhook IDs using the attributes of
# sensor.arlo_cam_api_webhook_paths after installing the integration.
MotionRecordingWebHookUrl: "http://192.168.50.172:8123/api/webhook/REPLACE_MOTION_ID"
StatusUpdateWebHookUrl: "http://192.168.50.172:8123/api/webhook/REPLACE_STATUS_ID"

# Upstream currently documents only the motion-recording and status-update
# webhooks as functional. The integration resets its own post-motion timer.
# Keep unsupported webhook types disabled instead of relying on them.
MotionTimeoutWebHookUrl: "http://127.0.0.1:9/disabled"
RegistrationWebHookUrl: "http://127.0.0.1:9/disabled"
ButtonPressWebHookUrl: "http://127.0.0.1:9/disabled"
AudioRecordingWebHookUrl: "http://127.0.0.1:9/disabled"
UserRecordingWebHookUrl: "http://127.0.0.1:9/disabled"
