name: Conventional release commit

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: read

jobs:
  title:
    runs-on: ubuntu-latest
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Validate squash-merge commit message
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore)(\([a-z0-9._/-]+\))?!?: .+'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "PR title must be a Conventional Commit because squash merge uses it as the release commit." >&2
            echo "Example: feat(deployment): generate verified configuration" >&2
            exit 1
          fi
