name: Bootstrap repository

on:
  push:
    branches:
      - main
    paths:
      - "bootstrap/**"
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct validated repository
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/part-* | base64 --decode > /tmp/hass-arlo-custom.tar.gz
          echo "3153ca468046f171da14d6dd55a0627acf91211ac7f169cf994d7b4587d108b5  /tmp/hass-arlo-custom.tar.gz" | sha256sum --check
          tar -xzf /tmp/hass-arlo-custom.tar.gz -C .
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Commit repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Add Arlo Home Assistant integration and deployment bundle"
          git push origin HEAD:main
